# Research at SNOW Corp.

- company: Portrait Editing & Hair Transfer
  duration: 2021 &mdash; Present
  summary: Developed generative models for advanced facial attribute manipulation including Face Lifting, Wrinkle Removal, and Hair Transfer. Supervised research leading to H-Adapter (ECCV 2026, last author).

- company: Object Removal
  duration: 2022 &mdash; 2023
  summary: Implemented counterfactual bootstrapping via Diffusion models for photorealistic object removal in real-world images.

- company: Face Reenactment
  duration: 2022 &mdash; 2023
  summary: Developed high-fidelity face reenactment pipelines leveraging 3DMMs and latent space manipulation for precise expression transfer.

- company: Image Segmentation & Matting
  duration: 2021 &mdash; 2022
  summary: Trained deep learning models for high-quality interactive segmentation and matting deployed in SNOW's global camera apps.

- company: 3D Facial & Body Fitting
  duration: 2021 &mdash; 2022
  summary: Trained neural networks for 3DMM-based face alignment and full-body pose estimation.
